[tools]
go = "1.27"
golangci-lint = "latest"
pre-commit = "latest"
"npm:markdownlint-cli2" = "latest"
typos = "latest"

[env]
VERSION = "dev"

[tasks.build]
description = "Build repotier binary from ./cmd/repotier (defaults to VERSION=dev)"
run = 'go build -ldflags "-X main.Version=${VERSION}" -o repotier ./cmd/repotier'

[tasks.clean]
description = "Remove compiled binary artifacts and test cache"
run = "rm -f repotier coverage.out && go clean -testcache"

[tasks.test]
description = "Run full test suite"
run = "go test -timeout 60s ./cmd/repotier/..."

[tasks.lint]
description = "Run gofmt, go vet, golangci-lint, markdownlint-cli2, and typos"
run = "test -z \"$(gofmt -l cmd/repotier)\" && go vet ./cmd/repotier/... && golangci-lint run ./cmd/repotier/... && markdownlint-cli2 \"**/*.md\" \"#.claude/**\" && typos"

[tasks.install]
description = "Install repotier binary into $GOPATH/bin or ~/go/bin"
run = 'go install -ldflags "-X main.Version=${VERSION}" ./cmd/repotier'

[tasks.hooks]
description = "Install git pre-commit hooks"
run = "pre-commit install"
