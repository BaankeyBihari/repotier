# @spec CLI-BUILD-001
name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "cmd/repotier/**"
      - "go.mod"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mise tools (Go 1.27)
        uses: jdx/mise-action@v2

      - name: Verify formatting, vet, and tests with coverage
        run: |
          test -z "$(gofmt -l cmd/repotier)"
          go vet ./cmd/repotier/...
          go test -timeout 15s -coverprofile=coverage.out ./cmd/repotier/...

      - name: Update coverage badge on badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PCT=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); printf "%.1f", $3}')
          COLOR=$(awk -v p="$PCT" 'BEGIN { if (p >= 80) print "brightgreen"; else if (p >= 70) print "green"; else if (p >= 50) print "yellow"; else print "orange" }')
          TMP_BADGE_DIR=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > "$TMP_BADGE_DIR/coverage.json"
          git -C "$TMP_BADGE_DIR" init -b badges
          git -C "$TMP_BADGE_DIR" config user.name "github-actions[bot]"
          git -C "$TMP_BADGE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TMP_BADGE_DIR" add coverage.json
          git -C "$TMP_BADGE_DIR" commit -m "chore: update coverage badge (${PCT}%)"
          git -C "$TMP_BADGE_DIR" push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
          rm -rf "$TMP_BADGE_DIR" coverage.out

      - name: Calculate next CalVer (YYYY.MM.N)
        id: calver
        run: |
          YM=$(date -u +%Y.%m)
          LAST_N=$(git tag -l "v${YM}.*" | sed "s/^v${YM}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n1 || true)
          if [ -z "$LAST_N" ]; then
            NEXT_N=1
          else
            NEXT_N=$((LAST_N + 1))
          fi
          VERSION="${YM}.${NEXT_N}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile release archives and checksums
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          mkdir -p dist build_tmp
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-X main.Version=${VERSION}" \
              -o build_tmp/repotier ./cmd/repotier
            tar -C build_tmp -czf "dist/repotier_${GOOS}_${GOARCH}.tar.gz" repotier
            rm -f build_tmp/repotier
          done
          (cd dist && shasum -a 256 repotier_*.tar.gz > checksums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          gh release create "$TAG" dist/repotier_*.tar.gz dist/checksums.txt \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}"
