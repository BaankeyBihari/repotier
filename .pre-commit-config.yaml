repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'unformatted=$(gofmt -l cmd/repotier); if [ -n "$unformatted" ]; then echo "Unformatted files: $unformatted"; exit 1; fi'
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./cmd/repotier/...
        language: system
        files: \.go$
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./cmd/repotier/...
        language: system
        files: \.go$
        pass_filenames: false
